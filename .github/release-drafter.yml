name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Funcionalidades'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Correções'
    labels:
      - 'fix'
      - 'bug'
  - title: '🛠 Manutenção'
    labels:
      - 'chore'
      - 'maintenance'
  - title: '📖 Documentação'
    labels:
      - 'documentation'
      - 'docs'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'
version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking-change'
  minor:
    labels:
      - 'minor'
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'patch'
      - 'fix'
      - 'bug'
      - 'chore'
      - 'documentation'
  default: patch
template: |
  ## O que mudou
  
  $CHANGES
